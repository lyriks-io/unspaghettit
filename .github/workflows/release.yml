name: Publish

# Publishes the package to npm when a GitHub Release is published, using npm
# Trusted Publishing (OIDC). No long-lived NPM_TOKEN secret: the job exchanges
# a short-lived GitHub OIDC token for npm credentials at publish time, and npm
# attaches build provenance automatically.
#
# One-time setup on npmjs.com (no repository secret required): on the
# `unspaghettit` package → Settings → Trusted Publisher → GitHub Actions, with
# organization `lyriks-io`, repository `unspaghettit`, workflow `release.yml`.
#
# Release flow:
#   1. Bump version + finalize CHANGELOG, commit `chore(release): x.y.z`.
#   2. Tag `vX.Y.Z` and push; let CI (ci.yml) go green on main.
#   3. Publish the GitHub Release for that tag — this workflow runs the
#      package's prepublishOnly gate (skills:check, bom:check, lint, build,
#      test) via `npm publish` and ships it.

on:
  release:
    types: [published]
  # Manual fallback: GitHub's `release` event won't fire a workflow that was
  # added to the default branch after the tag already existed, so a one-off
  # release can need a hand. Run this from Actions > Publish > "Run workflow"
  # (on `main`, which carries the version to publish).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing + provenance attestation

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 still ships 10.x.
      # Pinned to 11.18.0: `npm@latest` moved to 12.0.0 (2026-07-08), whose
      # provenance path fails with "Cannot find module 'sigstore'" and breaks
      # publish. 11.18.0 is the last 11.x and the version that shipped 0.7.0.
      # Revisit once npm 12.x fixes bundled sigstore.
      - name: Upgrade npm
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC trusted publishing and
      # attaches provenance automatically. `npm publish` runs prepublishOnly
      # (skills:check, bom:check, lint, build, test) before shipping.
      - name: Publish to npm
        run: npm publish
