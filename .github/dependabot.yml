version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-*
          - "@sveltejs/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # write-file-atomic v8 requires Node >=22.22.2; the package supports
      # Node >=20.10 (see package.json engines + CI matrix). Re-enable
      # this bump after Node 20 hits EOL (April 2026).
      - dependency-name: write-file-atomic
        versions:
          - ">=8.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
