version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-*
          - "@sveltejs/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # write-file-atomic v8 requires Node >=22.22.2; the package supports
      # Node >=22.12 (see package.json engines + CI matrix). Re-enable
      # this bump once the floor reaches 22.22.2.
      - dependency-name: write-file-atomic
        versions:
          - ">=8.0.0"
      # SvelteKit 3 and adapter-node 6 are a framework migration (svelte.config.js
      # goes, $lib becomes #lib, TypeScript 6 and Node 22.17 floors, the custom
      # dashboard server to review), planned as its own change.
      - dependency-name: "@sveltejs/kit"
        update-types:
          - version-update:semver-major
      - dependency-name: "@sveltejs/adapter-node"
        update-types:
          - version-update:semver-major
      # eslint-plugin-svelte 3 brings new recommended rules (each keys, resolve()
      # on links, SvelteMap/SvelteSet, writable $derived) with about 200 findings
      # across the dashboard: a code change of its own, not a bump.
      - dependency-name: eslint-plugin-svelte
        update-types:
          - version-update:semver-major
      # eslint 10 cannot install beside eslint-plugin-svelte 2 (its peer range
      # stops below 10): the two majors move together, as that same lint change.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # @eslint/js carries eslint's own recommended rules and follows its major:
      # 10 moves with eslint 10, as that same lint change.
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      # The types follow the oldest Node the package supports (engines >=22.12),
      # so the code cannot call an API that floor lacks: move them with the floor.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the native compiler: the build, svelte-check and the
      # library types are to move with it as one planned change.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
