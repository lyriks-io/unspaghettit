<!doctype html>
<html lang="en" class="h-full" data-theme="%unspa.theme%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Theme bootstrap. The server fills the data-theme placeholder above from
      PUBLIC_UNSPA_THEME (the CLI default) in hooks.server.ts. This runs before
      first paint and lets a saved in-app switcher choice (localStorage) win
      over that default, so the page never flashes the wrong colour skin. Kept
      tiny + guarded so a blocked storage API (private browsing) just leaves
      the server default.
    -->
    <script>
      try {
        var t = localStorage.getItem('unspa.theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="%sveltekit.assets%/unspaghettit_logo.png" type="image/png" />
    <meta name="description" content="Executable specifications for AI-assisted software development. Local-first and MCP-native by Lyriks.io." />
    <meta property="og:title" content="Unspaghettit" />
    <meta property="og:description" content="Executable specifications for AI-assisted software development. Local-first and MCP-native." />
    <meta property="og:image" content="%sveltekit.assets%/unspaghettit_logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Unspaghettit" />
    <meta name="twitter:description" content="Executable specifications for AI-assisted software development." />
    <meta name="twitter:image" content="%sveltekit.assets%/unspaghettit_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <title>Unspaghettit</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="h-full bg-neutral-50 text-neutral-900 antialiased">
    <div id="app" class="h-full">%sveltekit.body%</div>
  </body>
</html>
